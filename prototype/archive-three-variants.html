lay:grid;place-items:center;color:#3580ef;box-shadow:0 0 0 9px #e3eaf555,0 0 0 18px #e3eaf52a}.pulse-orb svg{width:43px;height:43px}.is-active .pulse-orb{background:#deeee7;color:#28a071;border-color:#c3e6d5;box-shadow:0 0 0 9px #dceee455,0 0 0 18px #deeee52a}.pulse-area h2{font-size:23px;letter-spacing:-.7px;font-weight:650;margin:9px 0 7px}.pulse-area p{font-size:11px;color:#778191;line-height:1.6;margin:0}.main-body{padding:0 17px 17px}.duration-label{display:flex;justify-content:space-between;font-size:10px;color:#687384;margin-bottom:9px}.duration-label span:last-child{color:#9099a7}.segmented{background:#dbe1e980;border:1px solid #cdd5e05e;padding:3px;display:flex;border-radius:8px;gap:2px}.segmented button{flex:1;background:transparent;border-radius:5px;font-size:11px;color:#6a7483;padding:7px 0}.segmented button[aria-pressed=true]{background:#fff;box-shadow:0 1px 4px #1424451b;color:#26354b;font-weight:550}.detail-group{background:#ffffff78;border:1px solid #d5dce77d;border-radius:10px;margin:15px 0;overflow:hidden}.detail-row{display:flex;align-items:center;gap:10px;font-size:11px;padding:12px}.detail-row+.detail-row{border-top:1px solid #dfe4ec}.detail-row svg{width:16px;height:16px;color:#7d899a}.detail-row .value{margin-left:auto;color:#69768b;font-size:10px}.detail-row .value.green{color:#32946d}.primary{width:100%;background:#2979ed;color:white;border:1px solid #1666d8;border-radius:9px;padding:11px;font-size:12px;font-weight:550;box-shadow:0 2px 3px #1265d018}.is-active .primary{background:#fff;color:#445264;border-color:#cbd5e2;box-shadow:none}.subhint{text-align:center;color:#929aa8;font-size:9px;margin:9px 0 0}.popover-footer{display:flex;justify-content:space-between;border-top:1px solid #d5dce7;padding:11px 17px;align-items:center;color:#8b95a4;font-size:9px}.popover-footer button{background:none;color:#6d798a;font-size:10px;padding:2px 0;display:flex;gap:5px;align-items:center}.popover-footer svg{width:13px;height:13px}.prototype-stamp{position: </style></head><body>
<!-- THROWAWAY: Three menu-bar app UI variants. All states are simulated in memory. -->
<div class="desktop"><div class="menubar"><span class="apple"></span><strong>Finder</strong><span class="menu-label">文件</span><span class="menu-label">编辑</span><span class="menu-label">显示</span><span class="bar-spacer"></span><button class="menu-app" aria-label="打开 MacBeat" id="bar-trigger"></button><span class="system-item" id="battery-icon"></span><span>周日 17:42</span></div><main class="showcase"><section class="intro"><div class="wordmark"><span class="app-icon" id="brand-icon"></span><strong>MacBeat</strong></div><div class="eyebrow">A QUIET LITTLE MAC UTILITY</div><h1>合上电脑。<br><span>工作继续。</span></h1><p>让 MacBook 在合盖后保持运行。<br>一个开关，让正在做的事继续。</p><div class="device" aria-hidden="true"><div class="device-top"></div><div class="device-base"></div><div class="device-light"></div></div><div class="design-label"><span></span>macOS 菜单栏应用 / 交互设计稿</div></section><section class="demo-area" aria-label="MacBeat 应用原型"><div id="app"></div><div class="prototype-stamp">交互原型 · 状态为模拟，不会改变系统睡眠设置</div></section></main></div>
<nav class="switcher" aria-label="设计方案"><button id="prev" aria-label="上一方案">←</button><div class="switch-label"><small id="variant-index"></small><strong id="variant-name"></strong></div><button id="next" aria-label="下一方案">→</button><span class="sep"></span><div class="states"><button data-state="idle">未开启</button><button data-state="active">运行中</button><button data-state="unavailable">不可用</button></div></nav>
<script>
const icons={pulse:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',lid:'<path d="M4 9h16l2 7H2zM3 19h18M10 16h4"/>',plug:'<path d="M9 3v5m6-5v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"/>',battery:'<rect x="2" y="6" width="17" height="12" rx="3"/><path d="M22 10v4M5 9h10v6H5z"/>',settings:'<path d="m12 3 2 3 4-.2.2 4L21 12l-2.8 2.2-.2 4-4-.2-2 3-2-3-4 .2-.2-4L3 12l2.8-2.2.2-4 4 .2z"/><circle cx="12" cy="12" r="3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',moon:'<path d="M20 14a9 9 0 0 1-10-12A9 9 0 1 0 20 14z"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
const names={A:'轻盈浮层 · 推荐',B:'极简原生菜单',C:'独立控制面板'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';
let state='idle',duration='2 小时',sessionDuration='2 小时',settings=false,powerOnly=true,login=false,lowBattery=true;
const active=()=>state==='active';const available=()=>state!=='unavailable';
function durationControl(){return `<div class="duration-label"><span>保持运行时长</span><span>${active()?'下次开启时生效':'到时自动结束'}</span></div><div class="segmented">${['30 分钟','1 小时','2 小时','不限时'].map(d=>`<button data-duration="${d}" aria-pressed="${duration===d}">${d}</button>`).join('')}</div>`}
function statusRows(){return `<div class="detail-group"><div class="detail-row">${svg('lid')}<span>合盖保持运行</span><span class="value ${active()?'green':''}">${!available()?'当前不可用':active()?'已开启':'待开启'}</span></div><div class="detail-row">${svg('plug')}<span>电源适配器</span><span class="value">已连接 · 86%</span></div></div>`}
function remaining(){return sessionDuration==='不限时'?'直到你手动停止':`剩余 ${{'30 分钟':'00:29:42','1 小时':'00:59:42','2 小时':'01:59:42'}[sessionDuration]} · 示例计时`}
function action(){return `${!available()?'<div class="unavailable">当前环境尚未验证合盖运行能力。查看设置了解当前状态。</div>':''}<button class="primary" data-action="toggle" ${available()?'':'disabled'}>${active()?'停止保持运行':'开启保持运行'}</button><p class="subhint">${active()?remaining():'屏幕可以熄灭，任务继续运行'}</p>`}
function footer(){return `<footer class="popover-footer"><span>${active()?'已运行 00:00:18 · 示例':powerOnly?'仅接通电源时运行':'允许使用电池运行'}</span><button data-action="settings">${svg('settings')}设置…</button></footer>`}
function mainView(){return `<section class="popover ${active()?'is-active':''}"><header class="popover-header"><span class="mini-icon">${svg('pulse')}</span><strong>MacBeat</strong><span class="header-right"><span class="status-dot ${active()?'active':''}"></span>${active()?'运行中':available()?'未开启':'需要设置'}</span></header><div class="pulse-area"><div class="pulse-orb">${svg(active()?'pulse':'moon')}</div><h2>${active()?'合上盖，继续运行。':available()?'准备好继续运行':'暂时无法开启'}</h2><p>${active()?'保持 Mac 唤醒，专注正在进行的工作。':available()?'开启后，MacBook 合盖也能保持唤醒。':'请先确认这台 Mac 的合盖运行能力。'}</p></div><div class="main-body">${durationControl()}${statusRows()}${action()}</div>${footer()}</section>`}
function toggleRow(label,desc,key,value){return `<div class="toggle-row"><div class="toggle-copy">${label}<small>${desc}</small></div><button class="switch" role="switch" aria-label="${label}" aria-checked="${value}" data-setting="${key}"></button></div>`}
function settingsView(){return `<section class="popover"><div class="settings-title"><button data-action="back" aria-label="返回主界面">‹</button>设置</div><div class="settings-content"><p>让 MacBeat 按你的习惯工作。</p><div class="settings-section">运行条件</div>${toggleRow('仅接通电源时运行','断开电源时，结束保持运行','powerOnly',powerOnly)}${toggleRow('低电量时停止','电量低于 20% 时，结束保持运行','lowBattery',lowBattery)}<div class="settings-section">通用</div>${toggleRow('登录时启动 MacBeat','启动后在菜单栏待命','login',login)}<div class="detail-group"><div class="detail-row">${svg('lid')}合盖运行能力<span class="value">${available()?'可用 · 模拟':'未验证'}</span></div></div><p class="small-note">“停止”只结束 MacBeat 的保持运行状态。之后由 macOS 和其他应用决定何时休眠。</p><div class="simulation"><label>原型场景<select id="scenario"><option value="idle" ${state==='idle'?'selected':''}>未开启</option><option value="active" ${active()?'selected':''}>运行中</option><option value="unavailable" ${!available()?'selected':''}>能力不可用</option></select></label></div></div><footer class="popover-footer"><span>MacBeat 设计预览</span><span>0.1 / CONCEPT</span></footer></section>`}
function menuView(){return `<section class="popover compact-menu"><header class="popover-header"><span class="mini-icon">${svg('pulse')}</span><strong>MacBeat</strong><span class="header-right">${active()?'运行中':available()?'未开启':'不可用'}</span></header><div class="compact-state">${active()?`合盖保持运行 · ${remaining()}`:'接通电源 · MacBook Pro'}</div><div class="menu-separator"></div><button class="menu-line current" data-action="toggle" ${available()?'':'disabled'}>${svg(active()?'moon':'pulse')}${active()?'停止保持运行':'开启合盖保持运行'}<span class="right">${active()?'已开启':''}</span></button><div class="menu-section">保持运行时长</div>${['30 分钟','1 小时','2 小时','不限时'].map(d=>`<button class="menu-line" data-duration="${d}"><span class="menu-check">${duration===d?'✓':''}</span>${d}</button>`).join('')}<div class="menu-separator"></div><button class="menu-line" data-setting="powerOnly"><span class="menu-check">${powerOnly?'✓':''}</span>仅接通电源时运行</button><div class="menu-separator"></div><button class="menu-line" data-action="settings">${svg('settings')}设置…</button><div class="compact-state">${available()?'停止后恢复系统睡眠策略':'当前合盖能力未验证，请查看设置'}</div></section>`}
function panelView(){return `<section class="popover panel ${active()?'is-active':''}"><header class="popover-header"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="panel-title">MacBeat</span></header><div class="panel-content"><div class="panel-status"><div class="pulse-orb">${svg(active()?'pulse':'moon')}</div><div><h2>${active()?'正在保持运行':available()?'让工作继续':'合盖能力未验证'}</h2><p>MacBook Pro · 接通电源 · 示例设备</p></div></div>${durationControl()}${statusRows()}${toggleRow('仅接通电源时运行','拔掉电源即可结束本次运行','powerOnly',powerOnly)}<div style="height:18px"></div>${action()}<div class="timeline"><span>${active()?'17:42':'—'}</span><span>${active()?'已开启合盖保持运行 · 示例记录':'开启后，在这里查看最近的运行记录'}</span></div></div>${footer()}</section>`}
function render(){document.getElementById('app').innerHTML=settings?settingsView():variant==='A'?mainView():variant==='B'?menuView():panelView();document.getElementById('bar-trigger').innerHTML=svg('pulse')+(active()?'<span class="menu-dot"></span>':'');document.getElementById('variant-index').textContent=`UI CONCEPT · ${variant} / 3`;document.getElementById('variant-name').textContent=names[variant];document.querySelectorAll('[data-state]').forEach(b=>{b.classList.toggle('selected',b.dataset.state===state);b.setAttribute('aria-pressed',String(b.dataset.state===state))});}
function cycle(n){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3];settings=false;history.replaceState(null,'',`?variant=${variant}`);render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('bar-trigger').onclick=()=>{settings=false;render()};
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}if(e.key==='Escape'&&settings){settings=false;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.duration){duration=b.dataset.duration;render()}if(b.dataset.state){state=b.dataset.state;if(active())sessionDuration=duration;render()}if(b.dataset.action==='toggle'&&available()){state=active()?'idle':'active';if(active())sessionDuration=duration;render()}if(b.dataset.action==='settings'){settings=true;render()}if(b.dataset.action==='back'){settings=false;render()}if(b.dataset.setting){if(b.dataset.setting==='powerOnly')powerOnly=!powerOnly;if(b.dataset.setting==='lowBattery')lowBattery=!lowBattery;if(b.dataset.setting==='login')login=!login;render()}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){state=e.target.value;if(active())sessionDuration=duration;render()}});
document.getElementById('brand-icon').innerHTML=svg('pulse');document.getElementById('battery-icon').innerHTML=svg('battery');render();
</script></body></html>
