her .sep{height:25px;background:#ffffff17;width:1px}.switcher .states{display:flex;gap:4px}.switcher .states button{font-size:10px;width:auto;padding:0 10px}.switcher .states button.selected{background:#29456c;color:#bfdbff}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.hidden{display:none!important}@media(max-width:1000px){.showcase{gap:40px;padding:80px 40px 135px;grid-template-columns:1fr 360px}.panel{width:360px}.intro h1{font-size:43px}}@media(max-width:740px){.menubar{gap:13px;padding:0 13px}.menu-label,.system-item.hide-mobile{display:none}.showcase{grid-template-columns:minmax(0,1fr);padding:43px 20px 140px;gap:40px;min-height:0}.intro{max-width:340px;margin:auto;width:100%}.intro .wordmark{margin-bottom:20px}.intro h1{font-size:37px;margin:16px 0}.intro h1 br{display:none}.intro p{font-size:12px}.intro .eyebrow,.device,.intro .design-label{display:none}.popover{max-width:100%}.demo-area{width:100%}.switcher{gap:8px;max-width:calc(100% - 20px);bottom:15px;padding:9px}.switcher .switch-label{min-width:100px}.switcher .states button{font-size:9px;padding:0 6px}.switcher .states button:last-child{display:none}.switcher .states{gap:3px}.prototype-stamp{font-size:8px}.panel-content{padding:19px}}

</style></head><body>
<!-- THROWAWAY: Selected lightweight popover with duration, deadline and manual end modes. All states are simulated in memory. -->
<div class="desktop"><div class="menubar"><span class="apple"></span><strong>Finder</strong><span class="menu-label">文件</span><span class="menu-label">编辑</span><span class="menu-label">显示</span><span class="bar-spacer"></span><button class="menu-app" aria-label="打开 MacBeat" id="bar-trigger"></button><span class="system-item" id="battery-icon"></span><span>周日 17:42</span></div><main class="showcase"><section class="intro"><div class="wordmark"><span class="app-icon" id="brand-icon"></span><strong>MacBeat</strong></div><div class="eyebrow">A QUIET LITTLE MAC UTILITY</div><h1>合上电脑。<br><span>工作继续。</span></h1><p>让 MacBook 在合盖后保持运行。<br>一个开关，让正在做的事继续。</p><div class="device" aria-hidden="true"><div class="device-top"></div><div class="device-base"></div><div class="device-light"></div></div><div class="design-label"><span></span>macOS 菜单栏应用 / 交互设计稿</div></section><section class="demo-area" aria-label="MacBeat 应用原型"><div id="app"></div><div class="prototype-stamp">交互原型 · 状态为模拟，不会改变系统睡眠设置</div></section></main></div>
<nav class="switcher" aria-label="预览状态"><div class="switch-label"><small>SELECTED DESIGN</small><strong>轻盈浮层 · MacBeat</strong></div><span class="sep"></span><div class="states"><button data-state="idle">未开启</button><button data-state="active">运行中</button><button data-state="unavailable">不可用</button></div></nav>
<script>
const icons={pulse:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',lid:'<path d="M4 9h16l2 7H2zM3 19h18M10 16h4"/>',plug:'<path d="M9 3v5m6-5v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"/>',battery:'<rect x="2" y="6" width="17" height="12" rx="3"/><path d="M22 10v4M5 9h10v6H5z"/>',settings:'<path d="m12 3 2 3 4-.2.2 4L21 12l-2.8 2.2-.2 4-4-.2-2 3-2-3-4 .2-.2-4L3 12l2.8-2.2.2-4 4 .2z"/><circle cx="12" cy="12" r="3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',moon:'<path d="M20 14a9 9 0 0 1-10-12A9 9 0 1 0 20 14z"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`;
let state='idle',duration='2 小时',settings=false,powerOnly=true,login=false,lowBattery=true;
let mode='deadline',sessionEnd=null,sessionStart=null,applied='',notice='';
const localValue=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
let deadline=localValue(new Date(Date.now()+7200000));
const active=()=>state==='active';const available=()=>state!=='unavailable';
const key=()=>JSON.stringify([mode,duration,deadline]);
function error(){if(mode!=='deadline')return '';if(!deadline)return '请选择结束日期和时间。';const time=new Date(deadline).getTime();if(!Number.isFinite(time)||time<=Date.now())return '结束时间需要晚于现在，请重新选择。';return '';}
function endForDraft(){return mode==='manual'?null:mode==='deadline'?new Date(deadline).getTime():Date.now()+({'30 分钟':1800,'1 小时':3600,'2 小时':7200}[duration]*1000);}
function formatEnd(time){return new Date(time).toLocaleString('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});}
function planText(){return error()|| (mode==='manual'?'保持运行，直到你手动停止。':`${formatEnd(endForDraft())} 结束保持运行`);}
function durationControl(){return `<div class="duration-label"><span>何时结束</span><span>${active()?'修改后点击更新':'到时恢复系统睡眠策略'}</span></div><div class="segmented end-modes">${[['duration','按时长'],['deadline','到时间'],['manual','手动停止']].map(([id,label])=>`<button data-mode="${id}" aria-pressed="${mode===id}">${label}</button>`).join('')}</div>${mode==='duration'?`<div class="duration-pills">${['30 分钟','1 小时','2 小时'].map(d=>`<button data-duration="${d}" aria-pressed="${duration===d}">${d}</button>`).join('')}</div>`:mode==='deadline'?`<label class="deadline-field"><span>${svg('clock')}结束时间</span><input aria-label="结束日期和时间" type="datetime-local" id="deadline" value="${deadline}" min="${localValue(new Date())}" required></label><div class="date-shortcuts"><button data-day="today">今天</button><button data-day="tomorrow">明天</button><span>本机当地时间</span></div>`:'<div class="manual-note">你可以随时从菜单栏停止。</div>'}<p id="plan-hint" class="plan-hint ${error()?'error':''}" aria-live="polite">${planText()}</p>${active()?`<button class="update-end" data-action="update" ${error()||applied===key()?'disabled':''}>更新结束时间</button>`:''}`;}
function statusRows(){return `<div class="detail-group"><div class="detail-row">${svg('lid')}<span>合盖保持运行</span><span class="value ${active()?'green':''}">${!available()?'当前不可用':active()?'已开启':'待开启'}</span></div><div class="detail-row">${svg('plug')}<span>电源适配器</span><span class="value">已连接 · 86%</span></div></div>`}
function remaining(){if(sessionEnd===null)return '直到你手动停止';const seconds=Math.max(0,Math.ceil((sessionEnd-Date.now())/1000));return `${formatEnd(sessionEnd)} 结束 · 剩余 ${String(Math.floor(seconds/3600)).padStart(2,'0')}:${String(Math.floor(seconds/60)%60).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
function action(){return `${!available()?'<div class="unavailable">当前环境尚未验证合盖运行能力。查看设置了解当前状态。</div>':''}<button class="primary" data-action="toggle" ${available()&&(active()||!error())?'':'disabled'}>${active()?'停止保持运行':'开启保持运行'}</button><p class="subhint" id="run-hint">${active()?remaining():'屏幕可以熄灭，任务继续运行'}</p>${notice?`<p class="action-notice" role="status">${notice}</p>`:''}`;}
function footer(){return `<footer class="popover-footer"><span>${active()?'正在运行 · 模拟':powerOnly?'仅接通电源时运行':'允许使用电池运行'}</span><button data-action="settings">${svg('settings')}设置…</button></footer>`;}
function mainView(){return `<section class="popover ${active()?'is-active':''}"><header class="popover-header"><span class="mini-icon">${svg('pulse')}</span><strong>MacBeat</strong><span class="header-right"><span class="status-dot ${active()?'active':''}"></span>${active()?'运行中':available()?'未开启':'需要设置'}</span></header><div class="pulse-area"><div class="pulse-orb">${svg(active()?'pulse':'moon')}</div><h2>${active()?'合上盖，继续运行。':available()?'准备好继续运行':'暂时无法开启'}</h2><p>${active()?'保持 Mac 唤醒，专注正在进行的工作。':available()?'开启后，MacBook 合盖也能保持唤醒。':'请先确认这台 Mac 的合盖运行能力。'}</p></div><div class="main-body">${durationControl()}${statusRows()}${action()}</div>${footer()}</section>`}
function toggleRow(label,desc,key,value){return `<div class="toggle-row"><div class="toggle-copy">${label}<small>${desc}</small></div><button class="switch" role="switch" aria-label="${label}" aria-checked="${value}" data-setting="${key}"></button></div>`}
function settingsView(){return `<section class="popover"><div class="settings-title"><button data-action="back" aria-label="返回主界面">‹</button>设置</div><div class="settings-content"><p>让 MacBeat 按你的习惯工作。</p><div class="settings-section">运行条件</div>${toggleRow('仅接通电源时运行','断开电源时，结束保持运行','powerOnly',powerOnly)}${toggleRow('低电量时停止','电量低于 20% 时，结束保持运行','lowBattery',lowBattery)}<div class="settings-section">通用</div>${toggleRow('登录时启动 MacBeat','启动后在菜单栏待命','login',login)}<div class="detail-group"><div class="detail-row">${svg('lid')}合盖运行能力<span class="value">${available()?'可用 · 模拟':'未验证'}</span></div></div><p class="small-note">“停止”只结束 MacBeat 的保持运行状态。之后由 macOS 和其他应用决定何时休眠。</p><div class="simulation"><label>原型场景<select id="scenario"><option value="idle" ${state==='idle'?'selected':''}>未开启</option><option value="active" ${active()?'selected':''}>运行中</option><option value="unavailable" ${!available()?'selected':''}>能力不可用</option></select></label></div></div><footer class="popover-footer"><span>MacBeat 设计预览</span><span>0.1 / CONCEPT</span></footer></section>`}
function render(){document.getElementById('app').innerHTML=settings?settingsView():mainView();document.getElementById('bar-trigger').innerHTML=svg('pulse')+(active()?'<span class="menu-dot"></span>':'');document.querySelectorAll('[data-state]').forEach(b=>{b.classList.toggle('selected',b.dataset.state===state);b.setAttribute('aria-pressed',String(b.dataset.state===state))});}
function begin(){if(error())return;sessionEnd=endForDraft();sessionStart=Date.now();applied=key();state='active';notice='';}
function stop(message='已停止保持运行 · 原型演示'){state='idle';sessionEnd=null;sessionStart=null;notice=message;}
function refreshDraft(){const hint=document.getElementById('plan-hint');if(hint){hint.textContent=planText();hint.classList.toggle('error',!!error());}const start=document.querySelector('[data-action="toggle"]');if(start)start.disabled=!available()||(!active()&&!!error());const update=document.querySelector('[data-action="update"]');if(update)update.disabled=!!error()||applied===key();}
function scene(value){notice='';if(value==='active'){if(error()){mode='duration';duration='2 小时';}begin();}else{state=value;sessionEnd=null;sessionStart=null;}render();}
document.getElementById('bar-trigger').onclick=()=>{settings=false;render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&settings){settings=false;render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){mode=b.dataset.mode;notice='';render();}if(b.dataset.duration){duration=b.dataset.duration;render();}if(b.dataset.day){const date=new Date();if(b.dataset.day==='tomorrow')date.setDate(date.getDate()+1);const parts=(deadline.split('T')[1]||'18:00').split(':');date.setHours(Number(parts[0]),Number(parts[1]),0,0);deadline=localValue(date);render();}if(b.dataset.state)scene(b.dataset.state);if(b.dataset.action==='toggle'&&available()){if(active())stop();else begin();render();}if(b.dataset.action==='update'&&active()&&!error()){sessionEnd=endForDraft();applied=key();notice='结束时间已更新 · 原型演示';render();}if(b.dataset.action==='settings'){settings=true;render();}if(b.dataset.action==='back'){settings=false;render();}if(b.dataset.setting){if(b.dataset.setting==='powerOnly')powerOnly=!powerOnly;if(b.dataset.setting==='lowBattery')lowBattery=!lowBattery;if(b.dataset.setting==='login')login=!login;render();}});
document.addEventListener('input',e=>{if(e.target.id==='deadline'){deadline=e.target.value;refreshDraft();}});
document.addEventListener('change',e=>{if(e.target.id==='scenario')scene(e.target.value);if(e.target.id==='deadline'){deadline=e.target.value;refreshDraft();}});
setInterval(()=>{if(active()&&sessionEnd!==null&&Date.now()>=sessionEnd){stop('已到结束时间 · 保持运行已结束（模拟）');render();}else{const hint=document.getElementById('run-hint');if(hint&&active())hint.textContent=remaining();refreshDraft();}},1000);
document.getElementById('brand-icon').innerHTML=svg('pulse');document.getElementById('battery-icon').innerHTML=svg('battery');render();
</script></body></html>
